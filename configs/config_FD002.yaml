# =============================================================================
# Configuracion Experimental - FD002
# =============================================================================
# Escenario: 6 condiciones operativas / 1 modo de falla (HPC)
# 
# Descripcion:
#   Este subconjunto introduce variabilidad operativa severa con 6 condiciones
#   diferentes (altitud, velocidad, regimen de vuelo) pero mantiene un unico
#   modo de falla (degradacion del HPC). Su objetivo es evaluar como maneja el
#   pipeline las fluctuaciones en las condiciones de operacion, que pueden
#   enmascarar o amplificar las senales de degradacion. Requiere analisis
#   especifico de normalizacion por regimen de vuelo en el EDA.
#
# Caracteristicas clave:
#   - 260 motores de entrenamiento, 259 de prueba
#   - 6 condiciones operativas (Sea Level, Altitude, etc.)
#   - Un solo modo de falla: HPC degradation
#   - Mayor ruido debido a variabilidad operativa
#   - Requiere EDA para identificar sensores afectados por condiciones
# =============================================================================

subset: "FD002"
description: >
  Escenario con alta variabilidad operativa: 6 condiciones diferentes de
  operacion (altitud, velocidad, regimen de vuelo) pero con un solo modo de
  falla (degradacion del compresor de alta presion - HPC). Este subconjunto
  evalua la robustez del pipeline ante fluctuaciones en las condiciones de
  operacion que pueden enmascarar las senales de degradacion. Los sensores a
  remover deben determinarse mediante EDA para identificar cuales son afectados
  por las condiciones operativas.

# Parametros de datos
data:
  data_dir: "datos"
  rul_max: 125           # Limite superior para Piecewise RUL (ciclos)
  window_size: 30        # Tamano de ventana temporal (ciclos)

# Configuracion de sensores
sensors:
  remove: [1, 5, 6, 10, 16, 18, 19]  # Invariantes intra-regimen (EDA FD002)

# Configuracion de Feature Engineering
feature_engineering:
  rolling_stats:
    enabled: true
    window_size: 30
    stat_types: ["mean", "std", "min", "max"]
  trends:
    enabled: true
    delta_steps: [1]

# Configuracion de Seleccion de Caracteristicas (Enfoque Hibrido)
feature_selection:
  enabled: true                        # Control para ablation study (true/false)
  method: "hybrid"                     # "hybrid" | "mutual_info" | "rf_importance"
  mutual_info:
    percentile: 60                     # Filtro univariado: conserva el top 60%
    random_state: 42
  rf_importance:
    n_features_to_select: 25           # Embebido multivariado: conserva las 25 mejores finales
    n_estimators: 100
    max_depth: 15
    random_state: 42
    n_jobs: -1

# Configuracion de Optimizacion de Hiperparametros (Optuna - Issue #11)
optimization:
  enabled: true                           # true: scripts/optimize.py incluye este subset
  n_trials: 50                            # Minimo 20 por criterio de aceptacion
  cv_folds: 5                             # CV interno de tuning (la evaluacion final usa evaluation.cv_folds)
  objective: "rmse"                       # rmse | nasa_score
  direction: "minimize"
  seed: 42                                # TPESampler reproducible
  models:
    random_forest:
      n_estimators: {type: int, low: 100, high: 800, step: 100}
      max_depth: {type: int, low: 5, high: 30}
      min_samples_leaf: {type: int, low: 1, high: 20}
    xgboost:
      n_estimators: {type: int, low: 100, high: 1000, step: 100}
      learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      max_depth: {type: int, low: 3, high: 12}
    lightgbm:
      n_estimators: {type: int, low: 100, high: 1000, step: 100}
      num_leaves: {type: int, low: 15, high: 63}
      learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      subsample: {type: float, low: 0.6, high: 1.0}
    svr:
      C: {type: float, low: 0.1, high: 100, log: true}
      epsilon: {type: float, low: 0.01, high: 1.0}
      kernel: {type: categorical, choices: [rbf, linear]}

# Modelos a evaluar
models:
  - name: "associative_memory"
    params:
      n_bins: 50
      discretization: "uniform"
      decoding_method: "centroid"

  - name: "random_forest"
    params:
      n_estimators: 100
      max_depth: 15
      min_samples_split: 2
      min_samples_leaf: 1
      n_jobs: -1

  - name: "xgboost"
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      n_jobs: -1

  - name: "lightgbm"
    params:
      n_estimators: 100
      num_leaves: 31
      learning_rate: 0.1
      subsample: 0.8
      n_jobs: -1

  - name: "svr"
    params:
      C: 1.0
      epsilon: 0.1
      kernel: "rbf"

  - name: "mlp"
    params:
      hidden_units: [128, 64]
      dropout: 0.2
      lr: 0.001

  - name: "cnn1d"
    params:
      conv_filters: [32, 64, 128]
      kernel_size: 3
      dropout: 0.2
      lr: 0.001

  - name: "lstm"
    params:
      hidden_dim: 64
      num_layers: 2
      dropout: 0.2
      lr: 0.001

# Configuracion de evaluacion
evaluation:
  cv_folds: 10
  statistical_test:
    alpha: 0.05
    higher_is_better: false
    force_test: null
    metrics_to_compare: ["rmse", "mae", "nasa_score", "latency_ms_engine", "peak_ram_mb", "train_time_sec"]

# Configuracion del experimento
experiment:
  random_seed: 42
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  mlflow_experiment_name: "rul_cmapss_FD002"
