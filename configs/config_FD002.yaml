# =============================================================================
# Configuracion Experimental - FD002
# =============================================================================
# Escenario: 6 condiciones operativas / 1 modo de falla (HPC)
# 
# Descripcion:
#   Este subconjunto introduce variabilidad operativa severa con 6 condiciones
#   diferentes (altitud, velocidad, regimen de vuelo) pero mantiene un unico
#   modo de falla (degradacion del HPC). Su objetivo es evaluar como maneja el
#   pipeline las fluctuaciones en las condiciones de operacion, que pueden
#   enmascarar o amplificar las senales de degradacion. Requiere analisis
#   especifico de normalizacion por regimen de vuelo en el EDA.
#
# Caracteristicas clave:
#   - 260 motores de entrenamiento, 259 de prueba
#   - 6 condiciones operativas (Sea Level, Altitude, etc.)
#   - Un solo modo de falla: HPC degradation
#   - Mayor ruido debido a variabilidad operativa
#   - Requiere EDA para identificar sensores afectados por condiciones
# =============================================================================

subset: "FD002"
description: >
  Escenario con alta variabilidad operativa: 6 condiciones diferentes de
  operacion (altitud, velocidad, regimen de vuelo) pero con un solo modo de
  falla (degradacion del compresor de alta presion - HPC). Este subconjunto
  evalua la robustez del pipeline ante fluctuaciones en las condiciones de
  operacion que pueden enmascarar las senales de degradacion. Los sensores a
  remover deben determinarse mediante EDA para identificar cuales son afectados
  por las condiciones operativas.

# Parametros de datos
data:
  data_dir: "datos"
  rul_max: 125           # Limite superior para Piecewise RUL (ciclos)
  window_size: 30        # Tamano de ventana temporal (ciclos)
  overlap: 0             # Overlap entre ventanas (0 = sin overlap)

# Configuracion de sensores
sensors:
  remove: []             # Pendiente de EDA - variabilidad operativa
  normalize: true        # Aplicar MinMax scaling

# Configuracion de Feature Engineering
feature_engineering:
  rolling_stats:
    enabled: true
    window_size: 30
    stat_types: ["mean", "std", "min", "max"]
  trends:
    enabled: true
    delta_steps: [1]

# Configuracion de Seleccion de Caracteristicas (Enfoque Hibrido)
feature_selection:
  enabled: true                        # Control para ablation study (true/false)
  method: "hybrid"                     # "hybrid" | "mutual_info" | "rf_importance"
  mutual_info:
    percentile: 60                     # Filtro univariado: conserva el top 60%
    random_state: 42
  rf_importance:
    n_features_to_select: 25           # Embebido multivariado: conserva las 25 mejores finales
    n_estimators: 100
    max_depth: 15
    random_state: 42
    n_jobs: -1

# Modelos a evaluar
models:
  - name: "associative_memory"
    params:
      n_bins: 50
      discretization: "uniform"
      decoding_method: "centroid"
    search_space:
      n_bins: [20, 100]
      discretization: ["uniform", "quantile"]
      decoding_method: ["centroid", "weighted_average"]

  - name: "random_forest"
    params:
      n_estimators: 100
      max_depth: 15
      min_samples_split: 2
      min_samples_leaf: 1
      n_jobs: -1
    search_space:
      n_estimators: [50, 300]
      max_depth: [5, 30]
      min_samples_split: [2, 20]
      min_samples_leaf: [1, 10]

  - name: "xgboost"
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      n_jobs: -1
    search_space:
      n_estimators: [50, 300]
      max_depth: [3, 15]
      learning_rate: [0.01, 0.3]
      subsample: [0.6, 1.0]

  - name: "lightgbm"
    params:
      n_estimators: 100
      num_leaves: 31
      learning_rate: 0.1
      subsample: 0.8
      n_jobs: -1
    search_space:
      n_estimators: [50, 300]
      num_leaves: [15, 63]
      learning_rate: [0.01, 0.3]
      subsample: [0.6, 1.0]

  - name: "svr"
    params:
      C: 1.0
      epsilon: 0.1
      kernel: "rbf"
    search_space:
      C: [0.1, 100]
      epsilon: [0.01, 1]
      kernel: ["rbf", "linear"]

  - name: "mlp"
    params:
      hidden_units: [128, 64]
      dropout: 0.2
      lr: 0.001
    search_space:
      hidden_layers: [[64, 32], [128, 64, 32], [256, 128, 64]]
      dropout: [0.1, 0.5]
      learning_rate: [0.001, 0.01]

  - name: "cnn1d"
    params:
      conv_filters: [32, 64, 128]
      kernel_size: 3
      dropout: 0.2
      lr: 0.001
    search_space:
      filters: [16, 64]
      kernel_size: [3, 7]
      hidden_size: [32, 128]

  - name: "lstm"
    params:
      hidden_dim: 64
      num_layers: 2
      dropout: 0.2
      lr: 0.001
    search_space:
      hidden_size: [32, 128]
      num_layers: [1, 3]
      dropout: [0.1, 0.5]

# Configuracion de evaluacion
evaluation:
  prediction_metrics: ["rmse", "mae", "nasa_score"]
  cv_folds: 10
  cv_group_by: "unit_number"
  statistical_test:
    alpha: 0.05
    higher_is_better: false
    force_test: null

# Perfilado de recursos computacionales (centro del analisis de trade-offs)
profiling:
  enabled: true
  metrics:
    - "train_time"                    # Tiempo de entrenamiento (segundos)
    - "inference_latency"             # Latencia de inferencia (ms/motor)
    - "ram_train"                     # Memoria RAM pico entrenamiento (MB)
    - "ram_inference"                 # Memoria RAM pico inferencia (MB)

# Configuracion del experimento
experiment:
  random_seed: 42
  n_jobs: -1
  verbose: 1
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  mlflow_experiment_name: "rul_cmapss_FD002"
