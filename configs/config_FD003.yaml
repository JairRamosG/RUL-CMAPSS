# =============================================================================
# Configuracion Experimental - FD003
# =============================================================================
# Escenario: 1 condicion operativa / 2 modos de falla (HPC + Fan)
# 
# Descripcion:
#   Este subconjunto mantiene una unica condicion operativa (nivel del mar) pero
#   introduce un segundo modo de falla: degradacion del ventilador (Fan) ademas
#   del compresor de alta presion (HPC). Esto permite evaluar la capacidad del
#   pipeline para adaptarse a multiples patrones de degradacion fisica cuando no
#   hay variabilidad en las condiciones de operacion.
#
# Caracteristicas clave:
#   - 100 motores de entrenamiento, 100 de prueba
#   - Sin variabilidad operativa (condiciones constantes)
#   - Dos modos de falla: HPC degradation + Fan degradation
#   - Evalua capacidad de discriminacion entre tipos de falla
# =============================================================================

subset: "FD003"
description: >
  Escenario con condicion operativa unica (Sea Level) pero con dos modos de
  falla: degradacion del compresor de alta presion (HPC) y degradacion del
  ventilador (Fan). Este subconjunto evalua la capacidad del pipeline para
  manejar multiples patrones de degradacion fisica cuando las condiciones
  operativas son constantes. La ausencia de variabilidad operativa permite
  aislar el efecto de la mezcla de fallas sobre el rendimiento de los modelos.

# Parametros de datos
data:
  data_dir: "datos"
  rul_max: 125           # Limite superior para Piecewise RUL (ciclos)
  window_size: 30        # Tamano de ventana temporal (ciclos)
  overlap: 0             # Overlap entre ventanas (0 = sin overlap)

# Configuracion de sensores
sensors:
  remove: [1, 5, 6, 10, 16, 18, 19]  # Mismos sensores que FD001
  normalize: true                      # Aplicar MinMax scaling

# Modelos a evaluar (mismos que FD001)
models:
  - name: "associative_memory"
    search_space:
      n_bins: [20, 100]
      discretization: ["uniform", "quantile"]
      decoding_method: ["centroid", "weighted_average"]

  - name: "random_forest"
    search_space:
      n_estimators: [50, 300]
      max_depth: [5, 30]
      min_samples_split: [2, 20]
      min_samples_leaf: [1, 10]

  - name: "xgboost"
    search_space:
      n_estimators: [50, 300]
      max_depth: [3, 15]
      learning_rate: [0.01, 0.3]
      subsample: [0.6, 1.0]

  - name: "svr"
    search_space:
      C: [0.1, 100]
      epsilon: [0.01, 1]
      kernel: ["rbf", "linear"]

  - name: "mlp"
    search_space:
      hidden_layers: [[64, 32], [128, 64, 32], [256, 128, 64]]
      dropout: [0.1, 0.5]
      learning_rate: [0.001, 0.01]

  - name: "cnn1d"
    search_space:
      filters: [16, 64]
      kernel_size: [3, 7]
      hidden_size: [32, 128]

  - name: "lstm"
    search_space:
      hidden_size: [32, 128]
      num_layers: [1, 3]
      dropout: [0.1, 0.5]

# Configuracion de evaluacion
evaluation:
  prediction_metrics: ["rmse", "mae", "nasa_score"]
  cv_folds: 5
  cv_group_by: "unit_number"

# Perfilado de recursos computacionales (centro del analisis de trade-offs)
profiling:
  enabled: true
  metrics:
    - "train_time"                    # Tiempo de entrenamiento (segundos)
    - "inference_latency"             # Latencia de inferencia (ms/motor)
    - "ram_train"                     # Memoria RAM pico entrenamiento (MB)
    - "ram_inference"                 # Memoria RAM pico inferencia (MB)

# Configuracion del experimento
experiment:
  random_seed: 42
  n_jobs: -1
  verbose: 1
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  mlflow_experiment_name: "rul_cmapss_FD003"
