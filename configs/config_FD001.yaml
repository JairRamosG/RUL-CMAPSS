# =============================================================================
# Configuracion Experimental - FD001
# =============================================================================
# Escenario: 1 condicion operativa (Sea Level) / 1 modo de falla (HPC)
# 
# Descripcion:
#   Este es el subconjunto mas simple y sirve como benchmark base para todo el
#   proyecto. Solo tiene una condicion operativa (nivel del mar) y un unico modo
#   de falla: degradacion del compresor de alta presion (HPC). Su objetivo es
#   permitir la depuracion del codigo core, validar el wrapper de Scikit-learn
#   de la Memoria Asociativa y establecer las lineas base de metricas para
#   comparar con los demas subconjuntos mas complejos.
#
# Caracteristicas clave:
#   - 100 motores de entrenamiento, 100 de prueba
#   - Sin variabilidad operativa (condiciones constantes)
#   - Sensores con varianza cero identificados y removidos
#   - Ideal para prototipar y validar el pipeline completo
# =============================================================================

subset: "FD001"
description: >
  Benchmark base con condicion operativa unica (Sea Level) y un solo modo de
  falla (degradacion del compresor de alta presion - HPC). Este escenario
  controlado permite depurar el pipeline completo, validar el wrapper de
  Scikit-learn para la Memoria Asociativa y establecer las metricas de referencia
  que se usaran para comparar con los subconjuntos de mayor complejidad.

# Parametros de datos
data:
  data_dir: "datos"
  rul_max: 125           # Limite superior para Piecewise RUL (ciclos)
  window_size: 30        # Tamano de ventana temporal (ciclos)
  overlap: 0             # Overlap entre ventanas (0 = sin overlap)

# Configuracion de sensores
sensors:
  remove: [1, 5, 6, 10, 16, 18, 19]  # Sensores constantes/baja varianza
  normalize: true                      # Aplicar MinMax scaling

# Configuracion de Feature Engineering
feature_engineering:
  rolling_stats:
    enabled: true
    window_size: 30
    stat_types: ["mean", "std", "min", "max"]
  trends:
    enabled: true
    delta_steps: [1]

# Configuracion de Seleccion de Caracteristicas (Enfoque Hibrido)
feature_selection:
  enabled: true                        # Control para ablation study (true/false)
  method: "hybrid"                     # "hybrid" | "mutual_info" | "rf_importance"
  mutual_info:
    percentile: 60                     # Filtro univariado: conserva el top 60%
    random_state: 42
  rf_importance:
    n_features_to_select: 25           # Embebido multivariado: conserva las 25 mejores finales
    n_estimators: 100
    max_depth: 15
    random_state: 42
    n_jobs: -1

# Modelos a evaluar
models:
  - name: "associative_memory"
    params:
      n_bins: 50
      discretization: "uniform"
      decoding_method: "centroid"
    search_space:
      n_bins: [20, 100]                    # Numero de bins para cuantizacion
      discretization: ["uniform", "quantile"]  # Estrategia de discretizacion
      decoding_method: ["centroid", "weighted_average"]  # Metodo de decodificacion

  - name: "random_forest"
    params:
      n_estimators: 100
      max_depth: 15
      min_samples_split: 2
      min_samples_leaf: 1
      n_jobs: -1
    search_space:
      n_estimators: [50, 300]    # Numero de arboles
      max_depth: [5, 30]         # Profundidad maxima
      min_samples_split: [2, 20] # Minimo muestras para dividir nodo
      min_samples_leaf: [1, 10]  # Minimo muestras en hoja

  - name: "xgboost"
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      n_jobs: -1
    search_space:
      n_estimators: [50, 300]    # Numero de boosting rounds
      max_depth: [3, 15]         # Profundidad maxima del arbol
      learning_rate: [0.01, 0.3] # Tasa de aprendizaje
      subsample: [0.6, 1.0]      # Submuestreo de filas

  - name: "lightgbm"
    params:
      n_estimators: 100
      num_leaves: 31
      learning_rate: 0.1
      subsample: 0.8
      n_jobs: -1
    search_space:
      n_estimators: [50, 300]    # Numero de boosting rounds
      num_leaves: [15, 63]       # Numero de hojas (leaf-wise)
      learning_rate: [0.01, 0.3] # Tasa de aprendizaje
      subsample: [0.6, 1.0]      # Submuestreo de filas

  - name: "svr"
    params:
      C: 1.0
      epsilon: 0.1
      kernel: "rbf"
    search_space:
      C: [0.1, 100]              # Parametro de regularizacion
      epsilon: [0.01, 1]         # Margen de tolerancia
      kernel: ["rbf", "linear"]  # Tipo de kernel

  - name: "mlp"
    params:
      hidden_units: [128, 64]
      dropout: 0.2
      lr: 0.001
    search_space:
      hidden_layers: [[64, 32], [128, 64, 32], [256, 128, 64]]  # Arquitecturas
      dropout: [0.1, 0.5]        # Tasa de dropout
      learning_rate: [0.001, 0.01]  # Tasa de aprendizaje

  - name: "cnn1d"
    params:
      conv_filters: [32, 64, 128]
      kernel_size: 3
      dropout: 0.2
      lr: 0.001
    search_space:
      filters: [16, 64]          # Numero de filtros por capa
      kernel_size: [3, 7]        # Tamano del kernel convolucional
      hidden_size: [32, 128]     # Neuronas en capa densa final

  - name: "lstm"
    params:
      hidden_dim: 64
      num_layers: 2
      dropout: 0.2
      lr: 0.001
    search_space:
      hidden_size: [32, 128]     # Tamano del estado oculto
      num_layers: [1, 3]         # Numero de capas LSTM
      dropout: [0.1, 0.5]        # Dropout entre capas

# Configuracion de evaluacion
evaluation:
  prediction_metrics: ["rmse", "mae", "nasa_score"]  # Metricas de precision
  cv_folds: 10                                        # 10 folds (10 motores por fold en FD001)
  cv_group_by: "unit_number"                          # Agrupar por motor (evitar leakage)
  statistical_test:
    alpha: 0.05
    higher_is_better: false
    force_test: null                                  # null: auto-seleccion, o 'friedman' / 'rm_anova'

# Perfilado de recursos computacionales (centro del analisis de trade-offs)
profiling:
  enabled: true                                       # Activar perfilado de recursos
  metrics:                                            # Metricas a registrar en cada ejecucion
    - "train_time"                                    # Tiempo de entrenamiento (segundos)
    - "inference_latency"                             # Latencia de inferencia (ms/motor)
    - "ram_train"                                     # Memoria RAM pico entrenamiento (MB)
    - "ram_inference"                                 # Memoria RAM pico inferencia (MB)

# Configuracion del experimento
experiment:
  random_seed: 42                          # Semilla para reproducibilidad
  n_jobs: -1                               # Usar todos los cores disponibles
  verbose: 1                               # Nivel de verbosidad
  mlflow_tracking_uri: "sqlite:///mlflow.db"  # URI de MLflow
  mlflow_experiment_name: "rul_cmapss_FD001"  # Nombre del experimento MLflow
