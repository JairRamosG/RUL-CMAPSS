[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rul-cmapss"
version = "0.1.0"
description = "Remaining Useful Life prediction using C-MAPSS dataset"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "torch>=2.0",
    "optuna>=3.0",
    "mlflow>=2.0",
    "psutil>=5.9",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["src*"]
